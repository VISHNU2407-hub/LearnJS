<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
<main class="main-wrapper"><div class="container">
    <div class="card">
        <div class="header">
            <div class="icon"><i class="fa-solid fa-quote-left"></i></div>
            <div>
                <h1>Random Quote Generator</h1>
                <p>Get inspired with random quotes</p>
            </div>
        </div>
        <div class="line"></div>
        <div class="quote-box">
            <i class="fa-solid fa-quote-left quote-icon left"></i>
            <p id="quote">"The only way to do great work is to love what you do."</p>
            <h3 id="author">— Steve Jobs</h3>
            <i class="fa-solid fa-quote-right quote-icon right"></i>
        </div>
        <div class="buttons">
            <button id="newQuote"><i class="fa-solid fa-rotate"></i> New Quote</button>
            <button id="copyBtn" class="secondary"><i class="fa-regular fa-copy"></i> Copy</button>
        </div>
        <footer>
            <span><i class="fa-regular fa-comment"></i> Quotes to inspire your day</span>
            <span>Made with 💜</span>
        </footer>
    </div>
</div></main>
<script src="script.js"></script>
  <footer class="vks-footer">
    <div class="vks-footer-inner">
      <p class="vks-footer-heart">Made with <span class="vks-heart">💜</span></p>
      <p class="vks-footer-brand" aria-label="VKS"><span class="vks-typing"></span><span class="vks-cursor">|</span></p>
      <p class="vks-footer-by">Visionary Kraft Studio</p>
      <div class="vks-footer-divider"></div>
      <p class="vks-footer-copy">&copy; 2026 Visionary Kraft Studio. All Rights Reserved.</p>
    </div>
  </footer>
<script src="../footer.js"></script>
</body>
</html>
