<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowBoard - Kanban Project Management</title>
  <meta name="description" content="A premium, production-quality Kanban board for task management.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ===== Navigation ===== -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <div class="nav__logo">
        <div class="nav__logo-icon" aria-hidden="true">F</div>
        <span class="nav__logo-text">FlowBoard</span>
      </div>

      <div class="nav__board-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-tertiary);">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <input type="text" class="nav__board-title-edit" id="board-title-input" value="Product Launch" aria-label="Board title" />
      </div>

      <div class="search-bar" role="search">
        <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-bar__input" id="search-input" placeholder="Search tasks… (Ctrl+K)" aria-label="Search tasks" />
        <button class="search-bar__clear" id="search-clear" aria-label="Clear search">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="nav__actions">
        <button class="icon-btn" aria-label="Notifications" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="icon-btn__badge"></span>
        </button>
        <button class="icon-btn" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div class="avatar" tabindex="0" role="button" aria-label="User profile">
          <span aria-hidden="true">JD</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== Main Content ===== -->
  <main class="main">
    <div class="board-container">

      <!-- Board Toolbar -->
      <div class="board-toolbar">
        <!-- Top Row: Search + Right Controls -->
        <div class="board-toolbar__row board-toolbar__row--top">
          <div class="board-toolbar__left">
            <!-- Category filter dropdown -->
            <div class="dropdown" id="filter-category">
              <button class="dropdown__trigger" aria-haspopup="true" aria-expanded="false">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <span>Category</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <div class="dropdown__menu" role="menu"></div>
            </div>
          </div>

          <div class="board-toolbar__right">
            <!-- Sort dropdown -->
            <div class="dropdown">
              <button class="dropdown__trigger" id="sort-trigger" aria-haspopup="true" aria-expanded="false">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
                <span>Sort</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <div class="dropdown__menu" role="menu"></div>
            </div>
          </div>
        </div>

        <!-- Bottom Row: Filter Pills -->
        <div class="board-toolbar__row board-toolbar__row--bottom">
          <div class="filter-pills" id="filter-priority-pills">
            <span class="filter-pills__label">Priority</span>
            <button class="filter-pill filter-pill--active" data-priority="all">
              <span class="filter-pill__dot filter-pill__dot--all"></span>
              All
            </button>
            <button class="filter-pill" data-priority="urgent">
              <span class="filter-pill__dot filter-pill__dot--urgent"></span>
              Urgent
            </button>
            <button class="filter-pill" data-priority="high">
              <span class="filter-pill__dot filter-pill__dot--high"></span>
              High
            </button>
            <button class="filter-pill" data-priority="medium">
              <span class="filter-pill__dot filter-pill__dot--medium"></span>
              Medium
            </button>
            <button class="filter-pill" data-priority="low">
              <span class="filter-pill__dot filter-pill__dot--low"></span>
              Low
            </button>
          </div>
        </div>
      </div>

      <!-- Board Columns -->
      <div class="board" id="board" role="application" aria-label="Kanban board"></div>

    </div>

    
  </main>

  <!-- ===== Modal Overlay ===== -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Task details">
    <div class="modal" id="modal"></div>
  </div>
  <!-- ===== Scripts ===== -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/board.js"></script>
  <script src="js/search.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/sort.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>
  <footer class="vks-footer">
    <div class="vks-footer-inner">
      <p class="vks-footer-heart">Made with <span class="vks-heart">💜</span></p>
      <p class="vks-footer-brand" aria-label="VKS"><span class="vks-typing"></span><span class="vks-cursor">|</span></p>
      <p class="vks-footer-by">Visionary Kraft Studio</p>
      <div class="vks-footer-divider"></div>
      <p class="vks-footer-copy">&copy; 2026 Visionary Kraft Studio. All Rights Reserved.</p>
    </div>
  </footer>
<script src="../footer.js"></script>
</body>
</html>
