<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <main class="main-wrapper">
    <div class="container">
        <div class="icon">🕒</div>
        <h1>Digital Clock</h1>
        <p class="subtitle">Your Time Use it Wise.</p>
        <div class="line"></div>
        <div class="clock-box">
            <div class="time-block">
                <h2 id="hours">00</h2>
                <span>HOURS</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <h2 id="minutes">00</h2>
                <span>MINUTES</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <h2 id="seconds">00</h2>
                <span>SECONDS</span>
            </div>
        </div>
        <div class="date-box">📅 <span id="date">Loading...</span></div>    </div>
  </main>
    <script src="script.js"></script>
  <footer class="vks-footer">
    <div class="vks-footer-inner">
      <p class="vks-footer-heart">Made with <span class="vks-heart">💜</span></p>
      <p class="vks-footer-brand" aria-label="VKS"><span class="vks-typing"></span><span class="vks-cursor">|</span></p>
      <p class="vks-footer-by">Visionary Kraft Studio</p>
      <div class="vks-footer-divider"></div>
      <p class="vks-footer-copy">&copy; 2026 Visionary Kraft Studio. All Rights Reserved.</p>
    </div>
  </footer>
<script src="../footer.js"></script>
</body>
</html>
