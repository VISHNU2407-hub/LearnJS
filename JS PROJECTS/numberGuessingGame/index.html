<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="../design-system.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <main class="main-wrapper">
    <div class="container">
        <div class="title">
            <div class="title-icon">🎯</div>
            <div>
                <h1>Guess the Number</h1>
                <p class="subtitle">Can you guess the secret number?</p>
            </div>
        </div>
        <div class="game-card">
            <div class="question">?</div>
            <div class="guess-box">
                <input type="number" id="guessInput" placeholder="Enter your guess (1-100)" min="1" max="100">
                <button id="guessBtn">Guess</button>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card">
                <h3>Attempts</h3>
                <h2 id="attempts">0</h2>
            </div>
            <div class="stat-card">
                <h3>Best Score</h3>
                <h2 id="bestScore">--</h2>
            </div>
            <div class="stat-card">
                <h3>Hint</h3>
                <h2 id="hint">--</h2>
            </div>
        </div>
        <div class="message" id="messageText">Start guessing!</div>
        <button id="restartBtn">Restart Game</button>
    </div>
  </main>
    <script src="script.js"></script>
  <footer class="vks-footer">
    <div class="vks-footer-inner">
      <p class="vks-footer-heart">Made with <span class="vks-heart">💜</span></p>
      <p class="vks-footer-brand" aria-label="VKS"><span class="vks-typing"></span><span class="vks-cursor">|</span></p>
      <p class="vks-footer-by">Visionary Kraft Studio</p>
      <div class="vks-footer-divider"></div>
      <p class="vks-footer-copy">&copy; 2026 Visionary Kraft Studio. All Rights Reserved.</p>
    </div>
  </footer>
<script src="../footer.js"></script>
</body>
</html>
