<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Prep — LearnJS</title>
  <meta name="description" content="Interview questions now live in your LearnJS dashboard — sign in and open the Interview Prep panel.">
  <link rel="icon" type="image/svg+xml" href="../../assets/logos/learnjs-mark.svg">
  <script>
    // Interview Prep lives inside the authenticated Dashboard now. Forward
    // immediately (replace = no history entry, so Back skips this page).
    window.location.replace("../dashboard/#interview");
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
    }
    html.dark body { background: #0b1220; color: #e7eef8; }
    .card {
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #eef2f7;
      border-radius: 20px;
      box-shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.08);
    }
    html.dark .card { background: #0e1626; border-color: #141d2e; }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #22c55e, #15803d);
      box-shadow: 0 10px 30px -8px rgba(34, 197, 94, 0.45);
    }
    .mark svg { width: 28px; height: 28px; color: #fff; }
    h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
    p { margin-top: 0.5rem; color: #5b6b83; font-size: 0.92rem; }
    html.dark p { color: #93a1b6; }
    a {
      display: inline-flex;
      margin-top: 1.4rem;
      padding: 0.72rem 1.5rem;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 10px 30px -8px rgba(34, 197, 94, 0.45);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></div>
    <h1>Interview Prep</h1>
    <p>Interview questions now live inside your Dashboard. Taking you there…</p>
    <a href="../dashboard/#interview">Open the Dashboard</a>
  </main>
</body>
</html>
