<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Builder — LearnJS</title>
  <meta name="description" content="LearnJS Project Builder — a sandboxed IDE for building HTML, CSS and JavaScript projects step by step.">
  <link rel="icon" type="image/svg+xml" href="../Website/assets/logos/learnjs-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="builder.css">
  <!-- CodeMirror 5 (CDN). Falls back to a plain textarea when offline. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("learnjs-theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="project-builder">
  <div class="pb-shell" id="pbShell">

    <!-- ==================== Header ==================== -->
    <header class="pb-header">
      <div class="pb-header-left">
        <a class="pb-back" id="backLink" href="../Website/pages/dashboard/" aria-label="Back to project">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          <span>Back to Project</span>
        </a>
        <div class="pb-title-wrap">
          <h1 class="pb-title" id="projectTitle">Project Builder</h1>
          <span class="pb-sub" id="projectSub">LearnJS</span>
        </div>
      </div>
      <div class="pb-header-right">
        <span class="pb-save" id="saveStatus" role="status" aria-live="polite">
          <span class="pb-save-dot" id="saveDot"></span>
          <span id="saveLabel">Saved</span>
        </span>
        <button class="pb-btn pb-btn-ghost" id="resetBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
        <button class="pb-btn pb-btn-ghost" id="hintBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg>
          Hint
        </button>
        <button class="pb-btn pb-btn-ghost" id="checkBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
          Check
        </button>
        <button class="pb-btn pb-btn-ghost" id="newProjectBtn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          New Project
        </button>
        <button class="pb-btn pb-btn-ghost" id="openFolderBtn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
          Open Folder
        </button>
        <button class="pb-btn pb-btn-ghost" id="downloadBtn" type="button" title="Download workspace as ZIP">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          Download
        </button>
        <button class="pb-btn pb-btn-primary" id="runBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86Z"/></svg>
          Run
        </button>
      </div>
    </header>

    <!-- ==================== Main workspace ==================== -->
    <div class="pb-main">

      <!-- ===== File explorer / Steps ===== -->
      <aside class="pb-side" id="pbSide" aria-label="Project files and steps">
        <div class="pb-side-tabs" role="tablist" aria-label="Explorer views">
          <button class="pb-side-tab active" id="tabFiles" data-side="files" role="tab" aria-selected="true" aria-controls="panelFiles" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5L3.5 6.6a1.5 1.5 0 0 0-.4 1V21c0 .6.4 1 1 1h16c.6 0 1-.4 1-1V5.5c0-.3-.1-.6-.3-.8L19.3 2.3a1.5 1.5 0 0 0-1-.3Z"/><path d="M15.5 2.5V6c0 .6.4 1 1 1h3.5"/></svg>
            Files
          </button>
          <button class="pb-side-tab" id="tabSteps" data-side="steps" role="tab" aria-selected="false" aria-controls="panelSteps" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h4"/><path d="M3 12h4"/><path d="M3 18h4"/><path d="M17 6h4"/><path d="M17 12h4"/><path d="M17 18h4"/><path d="M7 6h6"/><path d="M7 12h6"/><path d="M7 18h6"/></svg>
            Steps
          </button>
        </div>

        <!-- Files panel -->
        <div class="pb-panel active" id="panelFiles" role="tabpanel" aria-labelledby="tabFiles">
          <div class="pb-panel-head">
            <span class="pb-panel-title" id="explorerTitle">counter</span>
            <div class="pb-file-actions">
              <button class="pb-icon-btn" id="newFileBtn" type="button" title="New file" aria-label="New file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5L3.5 6.6a1.5 1.5 0 0 0-.4 1V21c0 .6.4 1 1 1h16c.6 0 1-.4 1-1V5.5c0-.3-.1-.6-.3-.8L19.3 2.3a1.5 1.5 0 0 0-1-.3Z"/><path d="M15.5 2.5V6c0 .6.4 1 1 1h3.5"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>
              </button>
              <button class="pb-icon-btn" id="newFolderBtn" type="button" title="New folder" aria-label="New folder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>
              </button>
              <button class="pb-icon-btn" id="renameBtn" type="button" title="Rename" aria-label="Rename selected file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button class="pb-icon-btn danger" id="deleteBtn" type="button" title="Delete" aria-label="Delete selected file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
              <button class="pb-icon-btn" id="openFolderIconBtn" type="button" title="Open folder" aria-label="Open a folder from your computer" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
              </button>
              <button class="pb-icon-btn" id="downloadIconBtn" type="button" title="Download ZIP" aria-label="Download workspace as ZIP">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
              </button>
            </div>
          </div>
          <div class="pb-tree" id="fileTree" role="tree" aria-label="Project files"></div>
        </div>

        <!-- Steps panel -->
        <div class="pb-panel" id="panelSteps" role="tabpanel" aria-labelledby="tabSteps" hidden>
          <div class="pb-panel-head">
            <span class="pb-panel-title">Guided Build</span>
          </div>
          <ol class="pb-steps" id="stepsList"></ol>
          <p class="pb-step-desc" id="stepDesc"></p>
        </div>
      </aside>

      <!-- ===== Code editor ===== -->
      <section class="pb-editor" aria-label="Code editor">
        <div class="pb-tabsbar" id="editorTabs" role="tablist" aria-label="Open files"></div>
        <div class="pb-editor-meta">
          <span class="pb-editor-file" id="editorFilename">index.html</span>
          <span class="pb-editor-mode" id="editorMode">HTML</span>
          <span class="pb-editor-pos" id="editorPos">Ln 1, Col 1</span>
        </div>
        <div class="pb-editor-host" id="editorHost">
          <textarea id="codeInput" spellcheck="false" aria-label="Code editor" placeholder="// Select a file to edit"></textarea>
        </div>
      </section>

      <!-- ===== Live preview ===== -->
      <section class="pb-preview" aria-label="Live preview">
        <div class="pb-preview-bar">
          <div class="pb-preview-nav">
            <button class="pb-icon-btn" id="previewBackBtn" type="button" title="Back" aria-label="Go back in preview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <label class="pb-entry-pick" id="entrySelectWrap" hidden>
              <span class="pb-entry-pick-label">Entry</span>
              <select class="pb-entry-select" id="entrySelect" aria-label="Preview entry page"></select>
            </label>
            <span class="pb-preview-path" id="previewPath" title="Current page">index.html</span>
          </div>
          <div class="pb-preview-tools">
            <div class="pb-device" role="group" aria-label="Preview device width">
              <button class="pb-device-btn active" data-width="desktop" type="button" title="Desktop" aria-label="Desktop preview width">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="4" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
              </button>
              <button class="pb-device-btn" data-width="tablet" type="button" title="Tablet" aria-label="Tablet preview width">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
              </button>
              <button class="pb-device-btn" data-width="mobile" type="button" title="Mobile" aria-label="Mobile preview width">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="9" height="19" x="7.5" y="2.5" rx="2"/><path d="M12 18h.01"/></svg>
              </button>
            </div>
            <button class="pb-icon-btn" id="refreshBtn" type="button" title="Refresh preview" aria-label="Refresh preview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="pb-icon-btn" id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Fullscreen preview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            </button>
          </div>
        </div>
        <div class="pb-preview-stage" id="previewStage">
          <div class="pb-preview-empty" id="previewEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9-4 3 4 3"/><path d="m16 9 4 3-4 3"/><path d="m13 5-2 14"/></svg>
            <span>Press <b>Run</b> to see your project</span>
          </div>
        </div>
      </section>
    </div>

    <!-- ==================== Console ==================== -->
    <section class="pb-console" aria-label="Console">
      <div class="pb-console-bar">
        <button class="pb-console-toggle" id="consoleToggle" type="button" aria-expanded="true" aria-controls="consoleOut">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
          Console
          <span class="pb-console-count" id="consoleCount" hidden>0</span>
        </button>
        <div class="pb-console-actions">
          <button class="pb-console-clear" id="consoleClearBtn" type="button">Clear</button>
        </div>
      </div>
      <div class="pb-console-out" id="consoleOut" role="log" aria-live="polite">
        <div class="pb-console-empty">Console output appears here — try pressing <b>Run</b>.</div>
      </div>
    </section>

    <!-- ==================== Mobile tabs ==================== -->
    <nav class="pb-mobile-tabs" aria-label="Builder panels">
      <button class="pb-mobile-tab active" data-view="files" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5L3.5 6.6a1.5 1.5 0 0 0-.4 1V21c0 .6.4 1 1 1h16c.6 0 1-.4 1-1V5.5c0-.3-.1-.6-.3-.8L19.3 2.3a1.5 1.5 0 0 0-1-.3Z"/><path d="M15.5 2.5V6c0 .6.4 1 1 1h3.5"/></svg>
        Files
      </button>
      <button class="pb-mobile-tab" data-view="code" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
        Code
      </button>
      <button class="pb-mobile-tab" data-view="preview" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="4" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
        Preview
      </button>
    </nav>
  </div>

  <!-- ==================== Modals ==================== -->
  <div class="pb-modal-backdrop" id="modalBackdrop" hidden></div>
  <div class="pb-modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="pb-modal-card">
      <h2 class="pb-modal-title" id="modalTitle">Confirm</h2>
      <p class="pb-modal-text" id="modalText"></p>
      <div class="pb-modal-field" id="modalFieldWrap" hidden>
        <input class="pb-modal-input" id="modalInput" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="pb-modal-actions">
        <button class="pb-btn pb-btn-ghost" id="modalCancel" type="button">Cancel</button>
        <button class="pb-btn pb-btn-primary" id="modalConfirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div class="pb-toast-region" id="toastRegion" aria-live="polite"></div>

  <script type="module" src="./builder.js"></script>
</body>
</html>
<!-- end of Project-Builder/index.html -->
